<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E hënë - Schedule</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#e0eafc 0%,#cfdef3 100%);min-height:100vh;padding:30px 20px}
.top-bar{max-width:1200px;margin:0 auto 30px;display:flex;align-items:center;justify-content:space-between}.back-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;background:#fff;color:#667eea;text-decoration:none;border-radius:10px;font-weight:600;font-size:15px;box-shadow:0 4px 14px rgba(102,126,234,.18)}
.page-title{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:22px 36px;border-radius:14px;box-shadow:0 10px 30px rgba(102,126,234,.25);display:flex;align-items:center;gap:16px}.page-title .icon{font-size:40px}.page-title .text h1{font-size:30px}.page-title .text p{font-size:14px;opacity:.9;margin-top:3px}
.schedule-wrap{max-width:1200px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.1)}
table{width:100%;height:calc(100vh - 300px);min-height:300px;border-collapse:separate;border-spacing:0;table-layout:fixed}thead th{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-size:17px;font-weight:600;padding:16px 8px;text-align:center;border-right:1px solid rgba(255,255,255,.15)}tbody td{font-size:26px;font-weight:700;text-align:center;padding:14px 5px;color:#2c3e50;border-right:1px solid #ecf0f1;background:#fafbfc;overflow-wrap:anywhere;line-height:1.1}tbody td:nth-child(1){background:#fff5f7;color:#e74c3c}tbody td:nth-child(2){background:#f0faff;color:#2980b9}tbody td:nth-child(3){background:#f0fff4;color:#27ae60}tbody td:nth-child(4){background:#fffbf0;color:#f39c12}tbody td:nth-child(5){background:#f8f0ff;color:#8e44ad}.schedule-footer{max-width:1200px;margin:20px auto 0;text-align:center;color:#7f8c8d;font-size:13px}
@media(max-width:768px){body{padding:12px 5px}.top-bar{flex-direction:column;gap:12px;align-items:stretch;margin-bottom:14px}.back-btn{justify-content:center}.page-title{justify-content:center;padding:14px 12px}.page-title .icon{font-size:26px}.page-title .text h1{font-size:22px}.schedule-wrap{width:100%;border-radius:12px}table{height:auto;min-height:0}thead th{font-size:10px;padding:8px 2px;line-height:1.2}tbody td{font-size:13px;padding:11px 2px;line-height:1.05;overflow-wrap:anywhere}.schedule-footer{font-size:10px;margin-top:10px}}
@media(max-width:480px){body{padding:8px 3px}.top-bar{gap:9px;margin-bottom:10px}.back-btn{padding:8px 12px;font-size:12px}.page-title{padding:11px 8px;gap:8px}.page-title .icon{font-size:22px}.page-title .text h1{font-size:19px}.page-title .text p{font-size:11px}.schedule-wrap{border-radius:9px}thead th{font-size:8px;padding:7px 1px}tbody td{font-size:12px;padding:9px 1px}}
</style>
</head>
<body>
<div class="top-bar"><a href="summerbreak.html" class="back-btn">&larr; Back to Schedule</a><div class="page-title"><span class="icon">📘</span><div class="text"><h1>E hënë</h1><p>Monday &middot; Daily Plan</p></div></div></div>
<div class="schedule-wrap"><table><thead><tr><th>Ora 1<br>13:00-13:45</th><th>Ora 2<br>13:50-14:35</th><th>Ora 3<br>14:45-15:30</th><th>Ora 4<br>15:35-16:20</th><th>Ora 5<br>16:25-17:10</th></tr></thead><tbody><tr><td>Gjuhe shqipe</td><td>Matematike</td><td>Njeriu dhe natyra</td><td>Ed. muzikor</td><td></td></tr></tbody></table></div>
<div class="schedule-footer">5 time slots &middot; 45 min each</div>
</body>
</html>
